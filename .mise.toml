[tools]
go = "1.25"
"npm:@fission-ai/openspec" = "latest"
pipx = "latest"
"pipx:esptool" = "latest"
python = "3.12"
shellcheck = "0.11.0"

[tasks.default]
description = "List available project tasks"
run = "mise tasks"

[tasks.build]
description = "Build the soil monitor for the local platform"
run = "go build -o build/soil-monitor ./cmd/soil-monitor"

[tasks.build-pi]
description = "Build a static Linux ARM64 binary for the Raspberry Pi"
env = { GOOS = "linux", GOARCH = "arm64", CGO_ENABLED = "0" }
run = "go build -trimpath -o build/soil-monitor-linux-arm64 ./cmd/soil-monitor"

[tasks.build-linux-arm64]
description = "Build a static Linux ARM64 binary"
env = { GOOS = "linux", GOARCH = "arm64", CGO_ENABLED = "0" }
run = "go build -trimpath -o build/soil-monitor-linux-arm64 ./cmd/soil-monitor"

[tasks.build-linux-amd64]
description = "Build a static Linux AMD64 binary"
env = { GOOS = "linux", GOARCH = "amd64", CGO_ENABLED = "0" }
run = "go build -trimpath -o build/soil-monitor-linux-amd64 ./cmd/soil-monitor"

[tasks.test]
description = "Run Go, release, and bootstrap workflow tests"
run = ["go test ./...", "./scripts/release_test.sh", "./scripts/bootstrap_test.sh"]

[tasks.fmt]
description = "Format Go source files"
run = "gofmt -w $(find . -name '*.go' -not -path './openspec/*')"

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.lint-shell]
description = "Lint repository shell scripts"
run = "shellcheck scripts/*.sh"

[tasks.release]
description = "Validate, build, and release to a supported Debian host"
depends = ["test", "vet", "lint-shell", "build-linux-arm64", "build-linux-amd64"]
run = "./scripts/release.sh"

[tasks.bootstrap]
description = "Provision a fresh Raspberry Pi or generic Debian host and release the appliance"
depends = ["test", "vet", "lint-shell", "build-linux-arm64", "build-linux-amd64"]
run = "./scripts/bootstrap.sh"
