apiVersion: apps/v1
kind: Deployment
metadata:
  name: soil-monitor
spec:
  # SQLite allows one writer: never run two pods against the same volume.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: soil-monitor
          image: ghcr.io/brooksmtownsend/wireless-soil-monitor
          env:
            # Override per environment in an overlay.
            - name: SOIL_MQTT_BROKER
              value: tcp://mosquitto:1883
            - name: SOIL_MQTT_CLIENT_ID
              value: soil-monitor
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soil-monitor-data
        - name: tmp
          emptyDir: {}
